name: Publish gem

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - name: Verify release
        run: bin/ci
      - name: Prepare release notes
        id: release
        run: |
          version="$(bundle exec ruby -Ilib -rboringbuilder/version -e 'print BoringBuilder::VERSION')"
          bin/release-notes > "$RUNNER_TEMP/release-notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Publish with RubyGems trusted publishing
        uses: rubygems/release-gem@7f9650160c1a4e7989fdc9855807bdbd421d8b6b # v1.4.1
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "v${{ steps.release.outputs.version }}"
          --verify-tag
          --title "BoringBuilder ${{ steps.release.outputs.version }}"
          --notes-file "$RUNNER_TEMP/release-notes.md"
