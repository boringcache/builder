name: Boringbuilder CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boringbuilder-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Format, lint, test, and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Restore Cargo archives with BoringCache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.5
        with:
          trust-policy: auto
          setup: none
          mode: archive
          cache-profiles: cargo
          fail-on-cache-error: ${{ github.event_name != 'pull_request' }}

      - name: Enable BoringCache compiler cache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.5
        with:
          trust-policy: auto
          setup: none
          mode: sccache
          fail-on-cache-error: ${{ github.event_name != 'pull_request' }}

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Verify artifact recipe
        run: cargo run --locked -- build -f examples/artifact.yml --dry-run

      - name: Verify Dockerfile recipe
        run: >-
          cargo run --locked -- build
          -f examples/image.Dockerfile
          --platform linux/arm64
          --format oci
          -o ./dist/example.oci
          --dry-run
