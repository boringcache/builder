name: Boringbuilder CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boringbuilder-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BORINGCACHE_RESTORE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_RESTORE_TOKEN || '' }}
  BORINGCACHE_SAVE_TOKEN: ${{ github.event_name != 'pull_request' && secrets.BORINGCACHE_SAVE_TOKEN || '' }}
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Format, lint, test, and plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Test with BoringCache Cargo
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.4
        with:
          trust-policy: auto
          setup: none
          mode: cargo
          fail-on-cache-error: ${{ github.event_name != 'pull_request' }}

      - name: Run Clippy with BoringCache Cargo
        run: boringcache cargo clippy --locked --all-targets -- -D warnings

      - name: Verify artifact recipe
        run: cargo run --locked -- build -f examples/artifact.yml --dry-run

      - name: Verify self-build Dockerfile
        run: >-
          cargo run --locked -- build
          -f Dockerfile
          --platform linux/arm64
          --format oci
          -o ./dist/example.oci
          --dry-run

  dogfood:
    name: Dockerless self-build and registry round-trip
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    services:
      registry:
        image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
        ports:
          - 5000:5000

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.94.1

      - name: Test with BoringCache Cargo
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.4
        with:
          trust-policy: publish
          setup: none
          mode: cargo
          fail-on-cache-error: true

      - name: Build release binary with BoringCache Cargo
        run: boringcache cargo build --locked --release

      - name: Build, push, and warm-rebuild with boringbuilder
        shell: bash
        run: |
          mkdir -p dist/dogfood
          boringcache_bin="$(command -v boringcache)"
          curl --fail --silent --show-error http://localhost:5000/v2/ >/dev/null
          sudo env \
            BORINGCACHE_RESTORE_TOKEN="$BORINGCACHE_RESTORE_TOKEN" \
            BORINGCACHE_SAVE_TOKEN="$BORINGCACHE_SAVE_TOKEN" \
            HOME="$HOME" \
            PATH="$PATH" \
            target/release/boringbuilder build \
              -f Dockerfile \
              --platform linux/amd64 \
              --format oci \
              -o dist/dogfood/image.oci \
              --cache boringcache \
              --cache-workspace boringcache/boringbuilder \
              --cache-bin "$boringcache_bin" \
              --timings-json dist/dogfood/seed-timings.json \
              --push "localhost:5000/boringbuilder/self:$GITHUB_SHA" \
              --insecure
          sudo env \
            BORINGCACHE_RESTORE_TOKEN="$BORINGCACHE_RESTORE_TOKEN" \
            BORINGCACHE_SAVE_TOKEN="$BORINGCACHE_SAVE_TOKEN" \
            HOME="$HOME" \
            PATH="$PATH" \
            target/release/boringbuilder build \
              -f Dockerfile \
              --platform linux/amd64 \
              --format oci \
              -o dist/dogfood/warm-image.oci \
              --cache boringcache \
              --cache-workspace boringcache/boringbuilder \
              --cache-bin "$boringcache_bin" \
              --timings-json dist/dogfood/warm-timings.json
          sudo chown -R "$(id -u):$(id -g)" dist
          test -f dist/dogfood/image.oci/oci-layout
          test -f dist/dogfood/image.oci/index.json
          test -f dist/dogfood/warm-image.oci/oci-layout
          python3 scripts/verify_warm_build.py \
            --seed-timings dist/dogfood/seed-timings.json \
            --warm-timings dist/dogfood/warm-timings.json \
            --seed-index dist/dogfood/image.oci/index.json \
            --warm-index dist/dogfood/warm-image.oci/index.json

      - name: Pull and verify the registry image without Docker
        run: >-
          python3 scripts/verify_registry_image.py
          --registry http://localhost:5000
          --repository boringbuilder/self
          --reference "$GITHUB_SHA"
          --output dist/dogfood/registry-roundtrip.json

      - name: Route evidence through BoringCache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.4
        with:
          trust-policy: publish
          setup: none
          mode: gha
          fail-on-cache-error: true

      - name: Upload dogfood evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boringbuilder-dogfood
          path: |
            dist/dogfood/image.oci/oci-layout
            dist/dogfood/image.oci/index.json
            dist/dogfood/warm-image.oci/oci-layout
            dist/dogfood/warm-image.oci/index.json
            dist/dogfood/seed-timings.json
            dist/dogfood/warm-timings.json
            dist/dogfood/registry-roundtrip.json
          if-no-files-found: error
          retention-days: 14
