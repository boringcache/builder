name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Ruby ${{ matrix.ruby }}
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "4.0.6"]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Verify gem
        run: bin/ci

  dagger:
    name: Dagger build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: "4.0.6"
          bundler-cache: true
      - name: Build a Node application through the shared Mise pipeline
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.9"
          dagger-flags: --silent
          verb: run
          args: >-
            -- bundle exec boringbuilder build --runtime docker --format directory
            --output dist/smoke test/fixtures/custom_node_app
      - name: Verify the custom pipeline artifact
        run: |
          test "$(cat test/fixtures/custom_node_app/dist/smoke/app/hello.txt)" = "hello from boringbuilder"
          grep -Eq '^v24\.' test/fixtures/custom_node_app/dist/smoke/app/node.txt
      - name: Build through the Mise-powered Rails pipeline
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: "0.21.9"
          dagger-flags: --silent
          verb: run
          args: >-
            -- bundle exec boringbuilder build --no-assets --no-bootsnap --runtime docker
            --format directory --path /rails --output dist/mise-smoke test/fixtures/rails_app
      - name: Verify the built-in Ruby artifact
        run: test -f test/fixtures/rails_app/dist/mise-smoke/rails/Gemfile
