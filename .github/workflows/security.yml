name: Boringbuilder Security

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: boringbuilder-security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request' && github.event.repository.visibility == 'public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject vulnerable dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          fail-on-scopes: runtime, development, unknown
          show-openssf-scorecard: true
          show-patched-versions: true

  audit:
    name: Dependencies and workflow safety
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install audited security tools
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.20.2,cargo-machete@0.9.2,ruff@0.16.3,zizmor@1.29.0
          fallback: none

      - name: Reject vulnerable, unmaintained, unsound, or yanked dependencies
        run: cargo audit --deny warnings

      - name: Reject unused dependencies
        run: cargo machete

      - name: Enforce dependency licenses and sources
        run: cargo deny check bans licenses sources

      - name: Audit GitHub Actions
        run: zizmor .github/workflows

      - name: Check repository scripts
        run: |
          ruff check scripts
          ruff format --check scripts
          python3 -m py_compile scripts/*.py
          shellcheck install.sh
