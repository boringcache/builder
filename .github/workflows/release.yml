name: Boringbuilder Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
  BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Restore Cargo archives with BoringCache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.5
        with:
          trust-policy: publish
          setup: none
          mode: archive
          cache-profiles: cargo
          fail-on-cache-error: true

      - name: Enable BoringCache compiler cache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.5
        with:
          trust-policy: publish
          setup: none
          mode: sccache
          fail-on-cache-error: true

      - name: Build release binary
        run: cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/boringbuilder" "boringbuilder-${{ matrix.name }}"
          chmod +x "boringbuilder-${{ matrix.name }}"

      - name: Route artifacts through BoringCache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.5
        with:
          trust-policy: publish
          setup: none
          mode: gha
          fail-on-cache-error: true

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boringbuilder-${{ matrix.name }}
          path: boringbuilder-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Route artifacts through BoringCache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.5
        with:
          trust-policy: restore
          setup: none
          mode: gha
          fail-on-cache-error: true

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: boringbuilder-*
          merge-multiple: true

      - name: Create checksums
        run: sha256sum boringbuilder-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" boringbuilder-* SHA256SUMS --generate-notes --verify-tag
