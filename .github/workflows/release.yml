name: Boringbuilder Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer release, for example v0.1.0-alpha.1 or v0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate version and source
        id: release
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
              echo "Manual releases must run from main." >&2
              exit 1
            fi
            version="$INPUT_VERSION"
          else
            version="$RELEASE_REF_NAME"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "Version must be valid SemVer prefixed with v." >&2
            exit 1
          fi

          package_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$version" != "v$package_version" ]]; then
            echo "Release $version does not match Cargo package version v$package_version." >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
              echo "Release tags must point to a commit on main." >&2
              exit 1
            fi
            git verify-tag "$version"
          fi

          prerelease=false
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+- ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify release source
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.94.1
          components: clippy,rustfmt

      - name: Test with BoringCache Cargo
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.4
        with:
          trust-policy: publish
          setup: none
          mode: cargo
          fail-on-cache-error: true

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: boringcache cargo clippy --locked --all-targets -- -D warnings

      - name: Install cargo-audit
        uses: taiki-e/install-action@a2a5f6e99e1a31540baa0468acfa302cff0f359f # v2.86.4
        with:
          tool: cargo-audit@0.22.2
          fallback: none

      - name: Audit dependencies
        run: cargo audit --deny warnings

  build:
    name: Build ${{ matrix.name }}
    needs: [validate, verify]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
      BORINGCACHE_SAVE_TOKEN: ${{ secrets.BORINGCACHE_SAVE_TOKEN }}
    permissions:
      attestations: write
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - name: macos-arm64
            runner: macos-14
            target: aarch64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-05
        with:
          toolchain: 1.94.1
          targets: ${{ matrix.target }}

      - name: Test with BoringCache Cargo
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.4
        with:
          trust-policy: publish
          setup: none
          mode: cargo
          fail-on-cache-error: true

      - name: Build release binary with BoringCache Cargo
        run: boringcache cargo build --locked --release --target "${{ matrix.target }}"

      - name: Package binary
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/boringbuilder" "boringbuilder-${{ matrix.name }}"
          chmod +x "boringbuilder-${{ matrix.name }}"

      - name: Attest release binary
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: boringbuilder-${{ matrix.name }}

      - name: Route artifacts through BoringCache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.4
        with:
          trust-policy: publish
          setup: none
          mode: gha
          fail-on-cache-error: true

      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: boringbuilder-${{ matrix.name }}
          path: boringbuilder-${{ matrix.name }}
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish release
    needs: [validate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BORINGCACHE_RESTORE_TOKEN: ${{ secrets.BORINGCACHE_RESTORE_TOKEN }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Route artifacts through BoringCache
        uses: boringcache/one@dbbed01c94f89e6b52964e91477617ce6c39488d # v1 / 1.19.4
        with:
          trust-policy: restore
          setup: none
          mode: gha
          fail-on-cache-error: true

      - name: Download binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: boringbuilder-*
          merge-multiple: true

      - name: Create checksums
        run: sha256sum boringbuilder-* > SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          args=(--generate-notes)
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$EVENT_NAME" == "push" ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "$VERSION" boringbuilder-* SHA256SUMS "${args[@]}"

      - name: Verify release installation
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          install_dir="$RUNNER_TEMP/boringbuilder-bin"
          BORINGBUILDER_INSTALL_DIR="$install_dir" ./install.sh --version "$VERSION"
          test "$("$install_dir/boringbuilder" --version)" = "boringbuilder ${VERSION#v}"
