[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin",
]
all-features = true

[advisories]
yanked = "deny"
unmaintained = "workspace"
unsound = "all"

[bans]
multiple-versions = "deny"
wildcards = "deny"
skip = [
  { crate = "syn@2.0.119", reason = "OCI dependencies have not moved to syn 3" },
  { crate = "untrusted@0.7.1", reason = "aws-lc-rs still requires untrusted 0.7" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
