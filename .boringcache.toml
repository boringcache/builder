workspace = "boringcache/boringbuilder"

[entries.cargo-registry-cache]
tag = "cargo-registry-cache"

[entries.cargo-registry-index]
tag = "cargo-registry-index"

[entries.cargo-target]
kind = "cargo-target"
tag = "cargo-target"
path = "target"

[profiles.cargo]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-target"]

[adapters.sccache]
tag = "rust-compiler"
no-git = true
sccache-key-prefix = "boringbuilder/rust"

[adapters.cargo]
profiles = ["cargo"]
command = ["cargo", "build", "--locked", "--release"]
compiler-cache = "sccache"
metadata-hints = ["project=boringbuilder"]

[adapters.docker]
metadata-hints = ["project=boringbuilder", "purpose=builder-comparison"]
