workspace = "boringcache/boringbuilder"

[entries.cargo-registry-cache]
tag = "cargo-registry-cache"

[entries.cargo-registry-index]
tag = "cargo-registry-index"

[entries.cargo-git-db]
tag = "cargo-git-db"

[entries.cargo-target]
kind = "cargo-target"
tag = "cargo-target"
path = "target"

[profiles.cargo-deps]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db"]

[profiles.cargo]
entries = ["cargo-registry-cache", "cargo-registry-index", "cargo-git-db", "cargo-target"]

[adapters.sccache]
tag = "rust-compiler"
no-git = true
sccache-key-prefix = "boringbuilder/rust"

[adapters.cargo]
profiles = ["cargo"]
command = ["cargo", "test", "--locked", "--all-targets"]
compiler-cache = "sccache"
metadata-hints = ["project=boringbuilder"]
